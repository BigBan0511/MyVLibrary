name: Compilar MyVLibrary

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pext:
    name: Extensión para Playnite (.pext)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # La versión vive en extension/extension.yaml. Cada PR tiene que subirla, y una etiqueta vX.Y.Z tiene que coincidir con ella.
      - name: Comprobar la versión
        shell: pwsh
        run: |
          $version = (Select-String -Path extension/extension.yaml -Pattern '^Version:\s*([0-9][0-9.]*)').Matches[0].Groups[1].Value
          if (-not $version) { throw "No encuentro la versión en extension/extension.yaml" }
          $pkg = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $version) { Write-Host "::error file=web/package.json::web/package.json dice $pkg y extension.yaml dice $version; tienen que coincidir"; exit 1 }
          if ("${{ github.event_name }}" -eq 'pull_request') {
            git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
            $before = ((git show FETCH_HEAD:extension/extension.yaml) | Select-String -Pattern '^Version:\s*([0-9][0-9.]*)').Matches[0].Groups[1].Value
            if ([version]$version -le [version]$before) { Write-Host "::error file=extension/extension.yaml::La versión sigue en $version (en ${{ github.base_ref }} es $before). Súbela en extension/extension.yaml y web/package.json."; exit 1 }
            Write-Host "::notice title=Versión::$before -> $version"
          }
          if ("${{ github.ref }}" -like 'refs/tags/v*' -and "${{ github.ref_name }}" -ne "v$version") { Write-Host "::error::La etiqueta ${{ github.ref_name }} no coincide con la versión $version de extension.yaml"; exit 1 }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir la estantería (web)
        working-directory: web
        run: |
          npm ci
          node build.mjs
          node build.mjs --target=demo

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar la extensión
        run: dotnet build extension/MyVLibrary.csproj -c Release -o out/MyVLibrary

      - name: Empaquetar el .pext
        shell: pwsh
        run: |
          $version = $env:VERSION
          $dir = Resolve-Path out/MyVLibrary
          $dll = (Get-Item "$dir/MyVLibrary.dll").VersionInfo.ProductVersion
          if (-not $dll.StartsWith($version)) { throw "MyVLibrary.dll dice $dll y extension.yaml dice $version" }
          # Playnite ya trae su SDK; no debe ir dentro del paquete
          Remove-Item "$dir/Playnite.SDK.dll", "$dir/*.pdb" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$dir/web/index.html")) { throw "Falta web/index.html en el paquete" }
          if (-not (Test-Path "$dir/runtimes/win-x64/native/WebView2Loader.dll")) { throw "Falta WebView2Loader.dll en el paquete" }
          $name = "MyVLibrary_$($version.Replace('.', '_')).pext"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($dir, (Join-Path $PWD "out/$name"))
          "PEXT=out/$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $files = Get-ChildItem -Recurse -File $dir | ForEach-Object { $_.FullName.Substring("$dir".Length + 1) + " (" + [math]::Round($_.Length / 1KB) + " KB)" }
          Write-Host "::notice title=Contenido del paquete ($($files.Count) archivos, $([math]::Round((Get-Item "out/$name").Length / 1MB, 1)) MB)::$($files -join ' | ')"

      - uses: actions/upload-artifact@v4
        with:
          name: MyVLibrary-pext
          path: ${{ env.PEXT }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MyVLibrary-demo-navegador
          path: web/dist-demo/index.html

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PEXT }}
          generate_release_notes: true
